name: CI and Vercel deployment

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tickets
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickets -d tickets"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tickets:tickets@localhost:5432/tickets
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: api
      - run: python manage.py check
        working-directory: api
      - run: python manage.py test
        working-directory: api

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  deploy-production:
    name: Deploy full-stack production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_VERCEL_DEPLOY == 'true'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: .vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --global vercel@latest
      - run: pip install -r requirements.txt
        working-directory: api
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: python api/manage.py migrate
      - run: python api/manage.py seed_demo_data
      - run: python api/manage.py seed_demo_account
      - run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  release:
    name: Publish semantic release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-production.result == 'success'
    needs: [backend, frontend, deploy-production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Release from conventional commits
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          directory: api
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com
          build: "false"
          changelog: "false"
